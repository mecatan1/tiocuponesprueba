<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administrativo · El Tío Cupones</title>
<link rel="icon" type="image/webp" href="mascota.webp">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#b7d3c4; --sage-deep:#86ab98; --sage-dark:#5b8571;
    --navy:#1e3a5f; --navy-deep:#142944; --white:#fff;
    --red:#d1483c; --ink:#16324a; --cream:#fefaf0; --wa:#1f7a52;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{
    margin:0; background:var(--sage); color:var(--ink);
    font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased;
    padding:20px 12px 60px;
  }
  .admin-box{
    background:var(--cream); border:3px solid var(--navy); border-radius:18px;
    width:100%; max-width:900px; margin:0 auto; padding:20px;
    box-shadow:0 10px 28px rgba(0,0,0,.18);
  }
  .admin-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:2px dashed var(--sage-deep); padding-bottom:12px; margin-bottom:16px; flex-wrap:wrap;
  }
  .admin-title{
    font-family:'Luckiest Guy',sans-serif; font-weight:400; font-size:26px; color:var(--navy); margin:0;
  }
  .view-site-btn{
    background:var(--navy); color:#fff; text-decoration:none; border-radius:999px;
    padding:8px 16px; font-weight:800; font-size:12.5px;
  }
  .admin-bar{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:14px;
  }
  .admin-tabs, .admin-bar-r{ display:flex; gap:8px; flex-wrap:wrap; }
  .admin-tab{
    background:#fff; border:2px solid var(--navy); color:var(--navy);
    padding:8px 16px; border-radius:999px; font-weight:800; font-size:12.5px; cursor:pointer;
  }
  .admin-tab.active{ background:var(--navy); color:#fff; }
  .admin-form{
    background:#fff; border:2px solid var(--sage-dark); border-radius:14px;
    padding:16px; margin-bottom:20px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:12px;
  }
  .admin-field{ display:flex; flex-direction:column; gap:4px; }
  .admin-field.full, .admin-actions{ grid-column:1/-1; }
  .admin-field label{ font-size:11.5px; font-weight:800; color:var(--navy-deep); text-transform:uppercase; }
  .admin-field input{
    width:100%; min-width:0; padding:9px 11px; border:1.5px solid var(--sage-deep);
    border-radius:8px; font-size:14px; font-family:inherit; font-weight:600;
  }
  .admin-field textarea{
    width:100%; min-height:40px; padding:9px 11px; border:1.5px solid var(--sage-deep);
    border-radius:8px; font-size:14px; font-family:inherit; font-weight:600;
    line-height:1.35; resize:none; overflow:hidden; overflow-wrap:anywhere;
  }
  .link-status{ font-size:11.5px; font-weight:800; }
  .link-status.ok{ color:#2e7d32; }
  .link-status.warn{ color:#c62828; }
  .admin-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn-primary{
    background:var(--wa); color:#fff; border:0; padding:11px 20px;
    border-radius:10px; font-weight:900; font-size:14px; cursor:pointer;
  }
  .btn-secondary{
    background:var(--navy); color:#fff; border:0; padding:10px 14px;
    border-radius:10px; font-weight:800; font-size:12.5px; cursor:pointer;
  }
  .admin-list{ display:flex; flex-direction:column; gap:10px; }
  .admin-item{
    background:#fff; border:2px solid var(--sage-deep); border-radius:12px;
    padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .admin-item.off{ opacity:.55; }
  .admin-item-info{ flex:1; min-width:200px; }
  .admin-item-title{ font-weight:900; font-size:14.5px; color:var(--navy-deep); }
  .admin-item-sub{ font-size:12px; color:#5a5142; margin-top:2px; }
  .admin-item-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .btn-sm{
    border:1.5px solid var(--navy); background:#fff; color:var(--navy);
    padding:6px 11px; border-radius:8px; font-size:12px; font-weight:800; cursor:pointer;
  }
  .btn-sm.danger{ border-color:var(--red); color:var(--red); }
  .btn-sm.on{ background:#e8f5e9; border-color:#2e7d32; color:#1b5e20; }
  .admin-msg{
    position:sticky; top:8px; z-index:10; padding:12px 14px; border-radius:10px;
    font-size:13.5px; font-weight:800; margin-bottom:14px; border:2px solid transparent;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
  }
  .admin-msg.ok{ background:#e8f5e9; color:#1b5e20; border-color:#2e7d32; }
  .admin-msg.err{ background:#ffebee; color:#b71c1c; border-color:#c62828; }
  .admin-msg.info{ background:#e3f2fd; color:#0d47a1; border-color:#1e88e5; }
  @media(max-width:600px){
    body{ padding:8px 6px 40px; }
    .admin-box{ padding:12px; border-width:2px; }
    .admin-form{ padding:12px; gap:10px; }
    .admin-field input, .admin-field textarea{ font-size:16px; }
  }
</style>
</head>
<body>

<div class="admin-box">
  <div class="admin-header">
    <h1 class="admin-title">⚙️ Panel El Tío Cupones</h1>
    <a href="index.html" target="_blank" class="view-site-btn">🌐 Ver mi página pública ↗</a>
  </div>

  <div id="adminLoginView" style="text-align:center;padding:32px 10px">
    <p style="font-weight:700;color:var(--navy-deep);margin-bottom:18px;font-size:15px">
      Inicia sesión con tu cuenta de administrador (<b>dain.glez@hotmail.com</b>)
    </p>
    <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
      <button type="button" class="btn-primary" id="googleLoginBtn">🔑 Iniciar sesión con Google (Ventana)</button>
      <button type="button" class="btn-secondary" id="googleRedirectBtn">↪️ Entrar en esta misma pestaña</button>
    </div>
    <p id="loginMsg" style="color:#1e3a5f;font-weight:800;font-size:13.5px;margin-top:16px">⏳ Cargando conexión con Google...</p>
  </div>

  <div id="adminPanelView" hidden>
    <div class="admin-bar">
      <div class="admin-tabs">
        <button type="button" class="admin-tab active" id="tabCuponesBtn">🎟️ Cupones</button>
        <button type="button" class="admin-tab" id="tabOfertasBtn">🛍️ Ofertas</button>
      </div>
      <div class="admin-bar-r">
        <button type="button" class="btn-secondary" id="migrateBtn">📦 Migrar datos anteriores</button>
        <button type="button" class="btn-secondary" id="importSheetBtn">📥 Importar solo lo nuevo</button>
        <button type="button" class="btn-secondary" id="dedupeBtn">🧹 Quitar repetidos</button>
        <button type="button" class="btn-sm danger" id="logoutBtn">Salir</button>
      </div>
    </div>

    <div class="admin-msg info" id="adminMsg" hidden role="status"></div>

    <!-- SECCIÓN CUPONES -->
    <div id="adminCuponesSec">
      <form class="admin-form" id="cuponForm" novalidate>
        <input type="hidden" id="c_id">
        <div class="admin-field">
          <label for="c_tienda">Tienda / Categoría</label>
          <input type="text" id="c_tienda" list="tiendasList" value="Mercado Libre" required>
          <datalist id="tiendasList"><option value="Mercado Libre"><option value="Bancarios"><option value="Especiales"></datalist>
        </div>
        <div class="admin-field">
          <label for="c_descuento">Descuento (título)</label>
          <textarea id="c_descuento" rows="1" placeholder="$500 OFF o 10% OFF" required></textarea>
        </div>
        <div class="admin-field">
          <label for="c_descripcion">Descripción / compra mínima</label>
          <textarea id="c_descripcion" rows="1" placeholder="Compra mínima $3,000"></textarea>
        </div>
        <div class="admin-field">
          <label for="c_codigo">Código del cupón</label>
          <input type="text" id="c_codigo" placeholder="Vacío si no lleva código">
        </div>
        <div class="admin-field full">
          <label for="c_link">Tu link de afiliado de Mercado Libre</label>
          <textarea id="c_link" rows="1" placeholder="https://meli.la/... o tu link con matt_tool" required></textarea>
          <div class="link-status" id="c_link_status">Pega tu link de afiliado para verificarlo...</div>
        </div>
        <div class="admin-field">
          <label for="c_color">Color (nombre o #HEX)</label>
          <input type="text" id="c_color" list="coloresList" placeholder="Vacío = crema">
          <datalist id="coloresList">
            <option value="verde"><option value="amarillo"><option value="rojo"><option value="azul">
            <option value="celeste"><option value="morado"><option value="rosa"><option value="naranja">
            <option value="dorado"><option value="turquesa"><option value="gris"><option value="cafe">
            <option value="negro"><option value="blanco">
          </datalist>
        </div>
        <div class="admin-field">
          <label for="c_vence">Vencimiento (opcional)</label>
          <input type="text" id="c_vence" placeholder="AAAA-MM-DD HH:MM">
        </div>
        <div class="admin-field">
          <label for="c_orden">Orden (1 sale primero)</label>
          <input type="number" id="c_orden" value="10">
        </div>
        <div class="admin-actions">
          <button type="submit" class="btn-primary" id="c_save_btn">💾 Guardar cupón</button>
          <button type="button" class="btn-sm" id="c_cancel_btn" hidden>Cancelar edición</button>
        </div>
      </form>
      <div class="admin-list" id="adminCuponesList"></div>
    </div>

    <!-- SECCIÓN OFERTAS -->
    <div id="adminOfertasSec" hidden>
      <form class="admin-form" id="ofertaForm" novalidate>
        <input type="hidden" id="o_id">
        <div class="admin-field">
          <label for="o_titulo">Título del producto</label>
          <textarea id="o_titulo" rows="1" required></textarea>
        </div>
        <div class="admin-field">
          <label for="o_precio">Precio oferta ($)</label>
          <input type="number" step="0.01" id="o_precio" required>
        </div>
        <div class="admin-field">
          <label for="o_antes">Precio antes ($)</label>
          <input type="number" step="0.01" id="o_antes">
        </div>
        <div class="admin-field">
          <label for="o_vendedor">Vendedor</label>
          <textarea id="o_vendedor" rows="1"></textarea>
        </div>
        <div class="admin-field full">
          <label for="o_imagen">URL de imagen</label>
          <textarea id="o_imagen" rows="1" placeholder="https://http2.mlstatic.com/..." required></textarea>
        </div>
        <div class="admin-field full">
          <label for="o_link">Tu link de afiliado del producto</label>
          <textarea id="o_link" rows="1" placeholder="https://meli.la/... o link con matt_tool" required></textarea>
        </div>
        <div class="admin-field">
          <label for="o_descripcion">Descripción corta</label>
          <textarea id="o_descripcion" rows="1"></textarea>
        </div>
        <div class="admin-field">
          <label for="o_instrucciones">Instrucciones al reverso (opcional)</label>
          <textarea id="o_instrucciones" rows="1"></textarea>
        </div>
        <div class="admin-actions">
          <button type="submit" class="btn-primary" id="o_save_btn">💾 Guardar producto</button>
          <button type="button" class="btn-sm" id="o_cancel_btn" hidden>Cancelar edición</button>
        </div>
      </form>
      <div class="admin-list" id="adminOfertasList"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, getDocs, runTransaction } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $ = id => document.getElementById(id);

try {
  const app = initializeApp({
    apiKey: "AIzaSyCikdrkep__NflYuxg-eA3RkxEubohV5FU",
    authDomain: "el-tio-cupones.firebaseapp.com",
    projectId: "el-tio-cupones",
    storageBucket: "el-tio-cupones.firebasestorage.app",
    messagingSenderId: "941147559112",
    appId: "1:941147559112:web:53771ba7eb0e0b5e4001fd",
    measurementId: "G-2DJF9WHVES"
  });
  const auth = getAuth(app), db = getFirestore(app);
  window.__fbReady = true;
  $('loginMsg').textContent = "✅ Conectado. Toca uno de los botones de arriba para entrar.";

  const ADMIN_EMAIL = "dain.glez@hotmail.com";
  const SITE_REF = doc(db, "site", "data");

  const SHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ78FaPhtRhWjNC8uHzkLziSqURlcezoNRJIRfV9yQRLAyCe6U14OGo5qDQl0pm6fCAPyAFX0a3ywY1/pub?single=true&output=csv&gid=";
  const SHEET_CSV_URL = SHEET + "0";
  const OFERTAS_CSV_URL = SHEET + "527305852";

  const AFF_RE = /^https:\/\/(meli\.la\/|(www\.)?mercadolibre\.com(\.mx)?\/(sec\/|social\/|.*[?&]matt_tool=))/i;

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c]));

  function ensureUrl(u){
    if(!u) return "";
    const c = u.toString().replace(/[\u200B-\u200D\uFEFF\u00A0]/g, "").trim();
    if(!c || c === "#") return c;
    return /^https?:\/\//i.test(c) ? c : "https://" + c;
  }

  function normalizeRow(row){
    const o = {};
    Object.keys(row).forEach(k => { o[k.toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "")] = row[k]; });
    return o;
  }

  async function fetchCsvText(url, retries = 2){
    for(let a = 0; a <= retries; a++){
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
      try{
        const res = await fetch(url + "&t=" + Date.now(), { signal: ctl.signal, cache: "no-store" });
        clearTimeout(t);
        if(!res.ok) throw new Error("HTTP " + res.status);
        return await res.text();
      }catch(e){
        clearTimeout(t);
        if(a === retries) throw e;
        await new Promise(r => setTimeout(r, 600 * (a + 1)));
      }
    }
  }
  const parseCsv = text => Papa.parse(text, { header: true, skipEmptyLines: true }).data.map(normalizeRow);

  let rawC = [], rawO = [];

  async function mutate(fn){
    await runTransaction(db, async tx => {
      const s = await tx.get(SITE_REF), d = s.exists() ? s.data() : {};
      const data = {
        cupones: Array.isArray(d.cupones) ? d.cupones : [],
        ofertas: Array.isArray(d.ofertas) ? d.ofertas : []
      };
      fn(data);
      tx.set(SITE_REF, data);
    });
  }

  onSnapshot(SITE_REF, snap => {
    const d = snap.exists() ? snap.data() : {};
    rawC = (Array.isArray(d.cupones) ? d.cupones : []).slice().sort((a, b) => (Number(a.orden) || 99) - (Number(b.orden) || 99));
    rawO = Array.isArray(d.ofertas) ? d.ofertas : [];
    renderAdminCupones();
    renderAdminOfertas();
  }, err => {
    console.warn("Aviso Firestore:", err);
  });

  function showAuthError(err){
    $('loginMsg').style.color = '#c62828';
    const m = {
      'auth/unauthorized-domain': 'Dominio no autorizado en Firebase. Agrega "' + location.hostname + '" en Authentication → Configuración → Dominios autorizados.',
      'auth/popup-blocked': 'Tu navegador bloqueó la ventana emergente. Toca el botón azul "↪️ Entrar en esta misma pestaña".',
      'auth/popup-closed-by-user': 'Cerraste la ventana emergente antes de terminar. Toca de nuevo o usa el botón azul.',
      'auth/cancelled-popup-request': 'Había otra ventana abierta. Toca el botón azul "↪️ Entrar en esta misma pestaña".'
    };
    $('loginMsg').textContent = m[err.code] || ("Error al iniciar sesión (" + (err.code || '') + "): " + err.message);
  }

  getRedirectResult(auth).catch(showAuthError);

  $('googleLoginBtn').addEventListener('click', async () => {
    try{
      await signInWithPopup(auth, new GoogleAuthProvider());
    }catch(err){
      showAuthError(err);
    }
  });

  $('googleRedirectBtn').addEventListener('click', async () => {
    $('loginMsg').style.color = '#1e3a5f';
    $('loginMsg').textContent = "⏳ Redirigiendo a Google...";
    try{
      await signInWithRedirect(auth, new GoogleAuthProvider());
    }catch(err){
      showAuthError(err);
    }
  });

  $('logoutBtn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, user => {
    const ok = user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
    $('adminLoginView').hidden = !!ok;
    $('adminPanelView').hidden = !ok;
    if(ok) growAll();
    if(user && !ok){
      $('loginMsg').style.color = '#c62828';
      $('loginMsg').textContent = "La cuenta " + user.email + " no tiene permiso de administrador. Entra con " + ADMIN_EMAIL;
      signOut(auth);
    }
  });

  const growEls = () => document.querySelectorAll('.admin-field textarea');
  function autoGrow(el){ el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
  function growAll(){ requestAnimationFrame(() => growEls().forEach(autoGrow)); }
  growEls().forEach(el => {
    el.addEventListener('input', () => autoGrow(el));
    if(el.id !== 'o_instrucciones') el.addEventListener('keydown', e => { if(e.key === 'Enter') e.preventDefault(); });
  });
  window.addEventListener('resize', growAll);

  function showTab(t){
    $('tabCuponesBtn').classList.toggle('active', t === 'c');
    $('tabOfertasBtn').classList.toggle('active', t === 'o');
    $('adminCuponesSec').hidden = t !== 'c';
    $('adminOfertasSec').hidden = t !== 'o';
    growAll();
  }
  $('tabCuponesBtn').addEventListener('click', () => showTab('c'));
  $('tabOfertasBtn').addEventListener('click', () => showTab('o'));

  const linkInput = $('c_link'), linkStatus = $('c_link_status');
  linkInput.addEventListener('input', () => {
    const v = ensureUrl(linkInput.value);
    if(!v){
      linkStatus.textContent = "Pega tu link de afiliado para verificarlo...";
      linkStatus.className = "link-status";
    } else if(AFF_RE.test(v)){
      linkStatus.textContent = "✅ Link de afiliado válido (comisión protegida)";
      linkStatus.className = "link-status ok";
    } else {
      linkStatus.textContent = "⚠️ Revisa que el enlace lleve tu matt_tool, /sec/ o meli.la.";
      linkStatus.className = "link-status warn";
    }
  });
  const confirmLink = url => AFF_RE.test(url) || confirm("Este link NO parece llevar formato de afiliado ML. ¿Guardar de todos modos?");

  function adminMsg(text, type){
    const el = $('adminMsg');
    el.textContent = text || '';
    el.className = 'admin-msg ' + (type || 'info');
    el.hidden = !text;
  }
  function fbErr(err){
    const code = (err && err.code) || '';
    if(code === 'permission-denied') return 'Firestore rechazó la operación (permission-denied). Revisa tus Reglas de Firestore y tu sesión con ' + ADMIN_EMAIL + '.';
    return 'Error: ' + ((err && err.message) || err);
  }

  const one = s => (s || '').replace(/\s*\n\s*/g, ' ').trim();
  const need = (v, name) => v ? '' : 'Falta: ' + name + '. ';
  let delTimer = null;
  function armDelete(btn, run){
    if(btn.dataset.armed){ clearTimeout(delTimer); run(); return; }
    const old = btn.textContent;
    btn.dataset.armed = '1';
    btn.textContent = '¿Seguro? Toca otra vez';
    delTimer = setTimeout(() => { delete btn.dataset.armed; btn.textContent = old; }, 4000);
  }
  const setActivo = (list, id) => {
    const x = list.find(i => i._id === id);
    if(x) x.activo = (x.activo || 'si').toLowerCase() === 'no' ? 'si' : 'no';
  };

  $('cuponForm').addEventListener('submit', async e => {
    e.preventDefault();
    const id = $('c_id').value;
    const p = {
      tienda: $('c_tienda').value.trim() || 'Mercado Libre',
      descuento: one($('c_descuento').value),
      descripcion: one($('c_descripcion').value),
      codigo: $('c_codigo').value.trim().toUpperCase(),
      link: ensureUrl($('c_link').value.replace(/\s+/g, '')),
      color: $('c_color').value.trim(),
      vence: $('c_vence').value.trim(),
      orden: Number($('c_orden').value) || 10,
      verificado: Date.now()
    };
    const miss = need(p.descuento, 'Descuento (título)') + need(p.link, 'Link de afiliado');
    if(miss){ adminMsg(miss, 'err'); return; }
    if(!confirmLink(p.link)) return;
    try{
      if(id){
        await mutate(d => {
          const i = d.cupones.findIndex(x => x._id === id);
          if(i < 0) throw new Error('El cupón ya no existe.');
          d.cupones[i] = Object.assign({}, d.cupones[i], p);
        });
        adminMsg('✅ Cupón actualizado al instante', 'ok');
      }else{
        await mutate(d => { d.cupones.push(Object.assign({ _id: uid(), activo: 'si' }, p)); });
        adminMsg('✅ Cupón creado al instante', 'ok');
      }
      resetCuponForm(true);
    }catch(err){ adminMsg(fbErr(err), 'err'); }
  });

  function resetCuponForm(keepMsg){
    $('cuponForm').reset();
    $('c_id').value = ""; $('c_tienda').value = "Mercado Libre"; $('c_orden').value = "10";
    $('c_save_btn').textContent = "💾 Guardar cupón";
    $('c_cancel_btn').hidden = true;
    linkStatus.textContent = "Pega tu link de afiliado para verificarlo...";
    linkStatus.className = "link-status";
    growAll();
    if(keepMsg !== true) adminMsg('');
  }
  $('c_cancel_btn').addEventListener('click', () => resetCuponForm());

  function renderAdminCupones(){
    const list = $('adminCuponesList');
    if(!rawC.length){
      list.innerHTML = `<div class="admin-item-sub" style="text-align:center;padding:18px;font-weight:700">No hay cupones en el documento nuevo. Crea uno arriba, o toca <b>"📦 Migrar datos anteriores"</b> o <b>"📥 Importar solo lo nuevo"</b>.</div>`;
      return;
    }
    list.innerHTML = `<div class="admin-item-sub" style="font-weight:800">Total de cupones: ${rawC.length}</div>` + rawC.map(c => {
      const off = (c.activo || 'si').toLowerCase() === 'no';
      return `<div class="admin-item ${off ? 'off' : ''}">
        <div class="admin-item-info">
          <div class="admin-item-title">#${esc(c.orden || 10)} [${esc(c.tienda || 'ML')}] ${esc(c.descuento)} — <code>${esc(c.codigo || 'SIN CÓDIGO')}</code></div>
          <div class="admin-item-sub">${esc(c.descripcion || '')} ${c.color ? '· 🎨 ' + esc(c.color) : ''} ${c.vence ? '· ⏳ ' + esc(c.vence) : ''}</div>
        </div>
        <div class="admin-item-btns">
          <button type="button" class="btn-sm ${off ? '' : 'on'}" data-act="toggle" data-id="${esc(c._id)}">${off ? '🔴 Apagado (prender)' : '🟢 Activo (apagar)'}</button>
          <button type="button" class="btn-sm" data-act="edit" data-id="${esc(c._id)}">✏️ Editar</button>
          <button type="button" class="btn-sm danger" data-act="del" data-id="${esc(c._id)}">🗑️ Borrar</button>
        </div></div>`;
    }).join('');
  }

  $('adminCuponesList').addEventListener('click', async e => {
    const b = e.target.closest('button[data-act]');
    if(!b) return;
    const id = b.dataset.id, act = b.dataset.act, item = rawC.find(x => x._id === id);
    if(!item){ adminMsg('No encontré ese cupón.', 'err'); return; }
    try{
      if(act === 'toggle'){
        await mutate(d => setActivo(d.cupones, id));
        adminMsg('✅ Estado actualizado', 'ok');
      }else if(act === 'edit'){
        $('c_id').value = id;
        $('c_tienda').value = item.tienda || 'Mercado Libre';
        $('c_descuento').value = item.descuento || '';
        $('c_descripcion').value = item.descripcion || '';
        $('c_codigo').value = item.codigo || '';
        $('c_link').value = item.link || '';
        $('c_color').value = item.color || '';
        $('c_vence').value = item.vence || '';
        $('c_orden').value = item.orden || 10;
        growAll();
        $('c_save_btn').textContent = "💾 Guardar cambios";
        $('c_cancel_btn').hidden = false;
        linkInput.dispatchEvent(new Event('input'));
        adminMsg('✏️ Editando: ' + (item.descuento || 'cupón') + '. Pulsa "Guardar cambios" al terminar.', 'info');
        $('cuponForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }else if(act === 'del'){
        armDelete(b, async () => {
          try{
            await mutate(d => { d.cupones = d.cupones.filter(x => x._id !== id); });
            adminMsg('🗑️ Cupón eliminado', 'ok');
          }catch(err){ adminMsg(fbErr(err), 'err'); }
        });
      }
    }catch(err){ adminMsg(fbErr(err), 'err'); }
  });

  $('ofertaForm').addEventListener('submit', async e => {
    e.preventDefault();
    const id = $('o_id').value;
    const p = {
      titulo: one($('o_titulo').value),
      precio: $('o_precio').value.trim(),
      precio_antes: $('o_antes').value.trim(),
      vendedor: one($('o_vendedor').value),
      imagen: $('o_imagen').value.replace(/\s+/g, ''),
      link: ensureUrl($('o_link').value.replace(/\s+/g, '')),
      descripcion: one($('o_descripcion').value),
      instrucciones: $('o_instrucciones').value.trim()
    };
    const miss = need(p.titulo, 'Título') + need(p.precio, 'Precio oferta') + need(p.imagen, 'URL de imagen') + need(p.link, 'Link de afiliado');
    if(miss){ adminMsg(miss, 'err'); return; }
    if(!confirmLink(p.link)) return;
    try{
      if(id){
        await mutate(d => {
          const i = d.ofertas.findIndex(x => x._id === id);
          if(i < 0) throw new Error('El producto ya no existe.');
          d.ofertas[i] = Object.assign({}, d.ofertas[i], p);
        });
        adminMsg('✅ Producto actualizado', 'ok');
      }else{
        await mutate(d => { d.ofertas.push(Object.assign({ _id: uid(), activo: 'si' }, p)); });
        adminMsg('✅ Producto agregado', 'ok');
      }
      resetOfertaForm(true);
    }catch(err){ adminMsg(fbErr(err), 'err'); }
  });

  function resetOfertaForm(keepMsg){
    $('ofertaForm').reset();
    $('o_id').value = "";
    $('o_save_btn').textContent = "💾 Guardar producto";
    $('o_cancel_btn').hidden = true;
    growAll();
    if(keepMsg !== true) adminMsg('');
  }
  $('o_cancel_btn').addEventListener('click', () => resetOfertaForm());

  function renderAdminOfertas(){
    const list = $('adminOfertasList');
    if(!rawO.length){
      list.innerHTML = `<div class="admin-item-sub" style="text-align:center;padding:18px;font-weight:700">No hay productos guardados. Crea uno arriba.</div>`;
      return;
    }
    list.innerHTML = rawO.map(o => {
      const off = (o.activo || 'si').toLowerCase() === 'no';
      return `<div class="admin-item ${off ? 'off' : ''}">
        <div class="admin-item-info">
          <div class="admin-item-title">${esc(o.titulo)} — $${esc(o.precio)}</div>
          <div class="admin-item-sub">${esc(o.vendedor || '')} ${o.descripcion ? '· ' + esc(o.descripcion) : ''}</div>
        </div>
        <div class="admin-item-btns">
          <button type="button" class="btn-sm ${off ? '' : 'on'}" data-act="toggle" data-id="${esc(o._id)}">${off ? '🔴 Apagado' : '🟢 Activo'}</button>
          <button type="button" class="btn-sm" data-act="edit" data-id="${esc(o._id)}">✏️ Editar</button>
          <button type="button" class="btn-sm danger" data-act="del" data-id="${esc(o._id)}">🗑️ Borrar</button>
        </div></div>`;
    }).join('');
  }

  $('adminOfertasList').addEventListener('click', async e => {
    const b = e.target.closest('button[data-act]');
    if(!b) return;
    const id = b.dataset.id, act = b.dataset.act, item = rawO.find(x => x._id === id);
    if(!item){ adminMsg('No encontré ese producto.', 'err'); return; }
    try{
      if(act === 'toggle'){
        await mutate(d => setActivo(d.ofertas, id));
        adminMsg('✅ Estado actualizado', 'ok');
      }else if(act === 'edit'){
        $('o_id').value = id;
        $('o_titulo').value = item.titulo || '';
        $('o_precio').value = item.precio || '';
        $('o_antes').value = item.precio_antes || '';
        $('o_vendedor').value = item.vendedor || '';
        $('o_imagen').value = item.imagen || '';
        $('o_link').value = item.link || '';
        $('o_descripcion').value = item.descripcion || '';
        $('o_instrucciones').value = item.instrucciones || '';
        growAll();
        $('o_save_btn').textContent = "💾 Guardar cambios";
        $('o_cancel_btn').hidden = false;
        adminMsg('✏️ Editando: ' + (item.titulo || 'producto') + '. Pulsa "Guardar cambios" al terminar.', 'info');
        $('ofertaForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }else if(act === 'del'){
        armDelete(b, async () => {
          try{
            await mutate(d => { d.ofertas = d.ofertas.filter(x => x._id !== id); });
            adminMsg('🗑️ Producto eliminado', 'ok');
          }catch(err){ adminMsg(fbErr(err), 'err'); }
        });
      }
    }catch(err){ adminMsg(fbErr(err), 'err'); }
  });

  $('migrateBtn').addEventListener('click', async () => {
    if(!confirm("¿Copiar tus cupones y ofertas de la base anterior al formato nuevo?")) return;
    try{
      const [cs, os] = await Promise.all([getDocs(collection(db, "cupones")), getDocs(collection(db, "ofertas"))]);
      const conv = x => { const o = Object.assign({}, x.data()); delete o.likes; delete o.dislikes; o._id = x.id; return o; };
      const cupones = cs.docs.map(conv), ofertas = os.docs.map(conv);
      if(!cupones.length && !ofertas.length){ adminMsg('No encontré datos en la base anterior. Usa "Importar solo lo nuevo" para traerlos de Google Sheets.', 'err'); return; }
      await mutate(d => { d.cupones = cupones; d.ofertas = ofertas; });
      adminMsg('🎉 Migrados ' + cupones.length + ' cupones y ' + ofertas.length + ' ofertas.', 'ok');
    }catch(err){ adminMsg(fbErr(err), 'err'); }
  });

  const norm = s => (s || '').toString().toLowerCase().replace(/\s+/g, ' ').trim();
  const normLink = u => ensureUrl(u).toLowerCase().replace(/\/+$/, '');
  const cKey = c => normLink(c.link) + '|' + norm(c.codigo) + '|' + norm(c.descuento);
  const oKey = o => normLink(o.link) + '|' + norm(o.titulo);

  $('importSheetBtn').addEventListener('click', async () => {
    try{
      adminMsg('⏳ Leyendo tu Google Sheet…', 'info');
      const c = parseCsv(await fetchCsvText(SHEET_CSV_URL)).filter(r => ensureUrl(r.link));
      let o = [];
      try{ o = parseCsv(await fetchCsvText(OFERTAS_CSV_URL)).filter(r => r.titulo && ensureUrl(r.link)); }catch(e){}
      let addC = 0, addO = 0, skipC = 0, skipO = 0;
      await mutate(d => {
        addC = addO = skipC = skipO = 0;
        const kc = new Set(d.cupones.map(cKey)), ko = new Set(d.ofertas.map(oKey));
        c.forEach(r => {
          const item = {
            _id: uid(), tienda: r.tienda || "Mercado Libre", descuento: r.descuento || "",
            descripcion: r.descripcion || "", codigo: (r.codigo || "").toString().trim().toUpperCase(),
            link: ensureUrl(r.link), activo: (r.activo || "si").toString().trim().toLowerCase(),
            vence: r.vence || "", color: r.color || "", orden: d.cupones.length + 1, verificado: Date.now()
          };
          const k = cKey(item);
          if(kc.has(k)){ skipC++; return; }
          kc.add(k); d.cupones.push(item); addC++;
        });
        o.forEach(r => {
          const item = {
            _id: uid(), titulo: r.titulo, imagen: r.imagen || "", precio: r.precio || "",
            precio_antes: r.precio_antes || r['precio antes'] || "", descripcion: r.descripcion || "",
            instrucciones: r.instrucciones || "", vendedor: r.vendedor || "",
            link: ensureUrl(r.link), activo: (r.activo || "si").toString().trim().toLowerCase()
          };
          const k = oKey(item);
          if(ko.has(k)){ skipO++; return; }
          ko.add(k); d.ofertas.push(item); addO++;
        });
      });
      adminMsg('✅ Nuevos importados: ' + addC + ' cupones y ' + addO + ' ofertas. Ya existían: ' + skipC + ' cupones y ' + skipO + ' ofertas.', 'ok');
    }catch(err){ adminMsg("No se pudo importar: " + fbErr(err), "err"); }
  });

  $('dedupeBtn').addEventListener('click', async () => {
    if(!confirm("¿Quitar los cupones y ofertas repetidos? Se conserva la primera copia de cada uno.")) return;
    try{
      let rc = 0, ro = 0;
      await mutate(d => {
        rc = ro = 0;
        const s1 = new Set(), s2 = new Set();
        d.cupones = d.cupones.filter(x => { const k = cKey(x); if(s1.has(k)){ rc++; return false; } s1.add(k); return true; });
        d.ofertas = d.ofertas.filter(x => { const k = oKey(x); if(s2.has(k)){ ro++; return false; } s2.add(k); return true; });
      });
      adminMsg(rc || ro ? '🧹 Se quitaron ' + rc + ' cupones y ' + ro + ' ofertas repetidos.' : 'No encontré repetidos 👍', rc || ro ? 'ok' : 'info');
    }catch(err){ adminMsg(fbErr(err), 'err'); }
  });
} catch (initErr) {
  $('loginMsg').style.color = '#c62828';
  $('loginMsg').textContent = 'Error al inicializar Firebase: ' + initErr.message;
}
</script>
</body>
</html>

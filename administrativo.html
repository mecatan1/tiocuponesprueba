<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administrativo v6 · El Tío Cupones</title>
<link rel="icon" type="image/webp" href="mascota.webp">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{--s:#b7d3c4;--sd:#86ab98;--sk:#5b8571;--n:#1e3a5f;--nd:#142944;--r:#d1483c;--c:#fefaf0;--w:#1f7a52}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--s);color:#16324a;font-family:Arial,sans-serif;padding:14px 10px 50px}
.box{background:var(--c);border:3px solid var(--n);border-radius:18px;max-width:880px;margin:0 auto;padding:16px}
.row,.item{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hdr{border-bottom:2px dashed var(--sd);padding-bottom:10px;margin-bottom:14px}
h1{font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:24px;color:var(--n);margin:0}
.tab{background:#fff;border:2px solid var(--n);color:var(--n);padding:7px 14px;border-radius:99px;font-weight:800;cursor:pointer}
.tab.active,.btn2{background:var(--n);color:#fff}
form{background:#fff;border:2px solid var(--sk);border-radius:14px;padding:12px;margin:12px 0 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:800;color:var(--nd);text-transform:uppercase}
.full{grid-column:1/-1}
input,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--sd);border-radius:8px;font-size:14px;font-weight:600}
.btn1{background:var(--w);color:#fff;border:0;padding:10px 18px;border-radius:10px;font-weight:900;cursor:pointer}
.btn2{border:0;padding:8px 12px;border-radius:9px;font-weight:800;font-size:12px;cursor:pointer;text-decoration:none}
.item{background:#fff;border:2px solid var(--sd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item.off{opacity:.55}
.sm{border:1.5px solid var(--n);background:#fff;color:var(--n);padding:5px 9px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer}
.sm.on{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20}.sm.del{border-color:var(--r);color:var(--r)}
.msg{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:800;margin-bottom:10px;border:2px solid #2e7d32;background:#e8f5e9;color:#1b5e20}
.msg.err{background:#ffebee;color:#b71c1c;border-color:#c62828}
</style>
</head>
<body>
<div class="box">
  <div class="row hdr">
    <h1>⚙️ Panel El Tío Cupones (v6)</h1>
    <a href="index.html" target="_blank" class="btn2">🌐 Ver página pública ↗</a>
  </div>

  <div id="adminLoginView" style="text-align:center;padding:24px 10px">
    <p style="font-weight:700;margin-bottom:14px">Administrador: <b>dain.glez@hotmail.com</b></p>
    <button type="button" class="btn1" id="googleLoginBtn">🔑 Iniciar sesión con Google</button>
    <p id="loginMsg" style="font-weight:800;font-size:13px;margin-top:14px">⏳ Cargando v6...</p>
  </div>

  <div id="adminPanelView" hidden>
    <div class="row" style="margin-bottom:10px">
      <div class="row">
        <button type="button" class="tab active" id="tabCuponesBtn">🎟️ Cupones</button>
        <button type="button" class="tab" id="tabOfertasBtn">🛍️ Ofertas</button>
      </div>
      <div class="row">
        <button type="button" class="btn2" id="migrateBtn">📦 Migrar anteriores</button>
        <button type="button" class="btn2" id="importSheetBtn">📥 Importar de Sheet</button>
        <button type="button" class="btn2" id="dedupeBtn">🧹 Quitar repetidos</button>
        <button type="button" class="sm del" id="logoutBtn">Salir</button>
      </div>
    </div>

    <div class="msg" id="adminMsg">⏳ Verificando bloques...</div>

    <div id="adminCuponesSec">
      <form id="cuponForm" novalidate>
        <input type="hidden" id="c_id">
        <label>Tienda / Categoría<input id="c_tienda" value="Mercado Libre"></label>
        <label>Descuento (título)<input id="c_descuento" placeholder="$500 OFF o 10% OFF"></label>
        <label>Descripción / compra mínima<input id="c_descripcion" placeholder="Compra mínima $3,000"></label>
        <label>Código del cupón<input id="c_codigo" placeholder="Vacío si no lleva"></label>
        <label class="full">Link de afiliado Mercado Libre<input id="c_link" placeholder="https://..."><span id="c_link_status" style="font-size:11px"></span></label>
        <label>Color (verde, amarillo, rojo, azul)<input id="c_color" placeholder="Vacío = crema"></label>
        <label>Vencimiento (AAAA-MM-DD HH:MM)<input id="c_vence"></label>
        <label>Orden (1 sale primero)<input type="number" id="c_orden" value="10"></label>
        <div class="full row" style="justify-content:flex-start">
          <button type="submit" class="btn1" id="c_save_btn">💾 Guardar cupón</button>
          <button type="button" class="sm" id="c_cancel_btn" hidden>Cancelar</button>
        </div>
      </form>
      <div id="adminCuponesList"></div>
    </div>

    <div id="adminOfertasSec" hidden>
      <form id="ofertaForm" novalidate>
        <input type="hidden" id="o_id">
        <label>Título del producto<input id="o_titulo"></label>
        <label>Precio oferta ($)<input type="number" step="0.01" id="o_precio"></label>
        <label>Precio antes ($)<input type="number" step="0.01" id="o_antes"></label>
        <label>Vendedor<input id="o_vendedor"></label>
        <label class="full">URL de imagen<input id="o_imagen"></label>
        <label class="full">Link de afiliado del producto<input id="o_link"></label>
        <label>Descripción corta<input id="o_descripcion"></label>
        <label>Instrucciones<textarea id="o_instrucciones" rows="2"></textarea></label>
        <div class="full row" style="justify-content:flex-start">
          <button type="submit" class="btn1" id="o_save_btn">💾 Guardar producto</button>
          <button type="button" class="sm" id="o_cancel_btn" hidden>Cancelar</button>
        </div>
      </form>
      <div id="adminOfertasList"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
var $ = function(id){ return document.getElementById(id); };
firebase.initializeApp({
  apiKey: "AIzaSyCikdrkep__NflYuxg-eA3RkxEubohV5FU",
  authDomain: "el-tio-cupones.firebaseapp.com",
  projectId: "el-tio-cupones",
  storageBucket: "el-tio-cupones.firebasestorage.app",
  messagingSenderId: "941147559112",
  appId: "1:941147559112:web:53771ba7eb0e0b5e4001fd"
});
var auth = firebase.auth(), db = firebase.firestore();
var SITE_REF = db.collection("site").doc("data");
var ADMIN_EMAIL = "dain.glez@hotmail.com";

$('loginMsg').style.color = "#2e7d32";
$('loginMsg').textContent = "✅ Conectado (v6). Toca el botón verde para entrar.";

$('googleLoginBtn').onclick = function(){
  $('loginMsg').textContent = "⏳ Abriendo ventana de Google...";
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){
    $('loginMsg').style.color = "#c62828";
    $('loginMsg').textContent = "Error: " + e.message;
  });
};
$('logoutBtn').onclick = function(){ auth.signOut(); };
auth.onAuthStateChanged(function(u){
  var ok = u && u.email && u.email.toLowerCase() === ADMIN_EMAIL;
  $('adminLoginView').hidden = !!ok;
  $('adminPanelView').hidden = !ok;
  if(u && !ok){ alert("Usa la cuenta " + ADMIN_EMAIL); auth.signOut(); }
});
</script>

<script>
var rawC = [], rawO = [];
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s){ return String(s || "").replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">"); }
function urlOk(u){
  var c = String(u || "").trim();
  if(!c || c === "#") return "";
  return c.indexOf("http") === 0 ? c : "https://" + c;
}
function msg(t, err){
  var e = $('adminMsg');
  e.textContent = t;
  e.className = err ? "msg err" : "msg";
}
function save(txt){
  msg("⏳ Guardando en Firebase...", false);
  return SITE_REF.set({ cupones: rawC, ofertas: rawO }).then(function(){
    msg("✅ " + txt, false);
  }).catch(function(e){
    msg("❌ Error al guardar: " + e.message, true);
    alert("Error de Firebase: " + e.message);
  });
}

SITE_REF.onSnapshot(function(s){
  var d = (s.exists && s.data()) ? s.data() : {};
  rawC = (d.cupones || []).slice().sort(function(a,b){ return (Number(a.orden)||99) - (Number(b.orden)||99); });
  rawO = d.ofertas || [];
  drawC(); drawO();
}, function(e){ msg("❌ Error leyendo Firebase: " + e.message, true); });

$('tabCuponesBtn').onclick = function(){
  $('tabCuponesBtn').classList.add('active'); $('tabOfertasBtn').classList.remove('active');
  $('adminCuponesSec').hidden = false; $('adminOfertasSec').hidden = true;
};
$('tabOfertasBtn').onclick = function(){
  $('tabOfertasBtn').classList.add('active'); $('tabCuponesBtn').classList.remove('active');
  $('adminOfertasSec').hidden = false; $('adminCuponesSec').hidden = true;
};

$('cuponForm').onsubmit = function(e){
  e.preventDefault();
  var id = $('c_id').value;
  var p = {
    _id: id || uid(),
    tienda: $('c_tienda').value.trim() || "Mercado Libre",
    descuento: $('c_descuento').value.trim(),
    descripcion: $('c_descripcion').value.trim(),
    codigo: $('c_codigo').value.trim().toUpperCase(),
    link: urlOk($('c_link').value),
    color: $('c_color').value.trim(),
    vence: $('c_vence').value.trim(),
    orden: Number($('c_orden').value) || 10,
    verificado: Date.now(),
    activo: "si"
  };
  if(!p.descuento || !p.link) return msg("⚠️ Escribe el Descuento y el Link", true);
  var i = rawC.findIndex(function(x){ return x._id === id; });
  if(i >= 0){ p.activo = rawC[i].activo || "si"; rawC[i] = p; } else rawC.push(p);
  save("Cupón guardado al instante").then(function(){
    $('cuponForm').reset(); $('c_id').value = ""; $('c_tienda').value = "Mercado Libre";
    $('c_orden').value = "10"; $('c_save_btn').textContent = "💾 Guardar cupón"; $('c_cancel_btn').hidden = true;
  });
};
$('c_cancel_btn').onclick = function(){
  $('cuponForm').reset(); $('c_id').value = ""; $('c_save_btn').textContent = "💾 Guardar cupón"; $('c_cancel_btn').hidden = true;
};

function drawC(){
  if(!rawC.length){ $('adminCuponesList').innerHTML = "<p style='text-align:center;font-weight:700'>Sin cupones aún. Toca Importar de Sheet o Migrar anteriores.</p>"; return; }
  $('adminCuponesList').innerHTML = rawC.map(function(c){
    var off = (c.activo || "si") === "no";
    return '<div class="item '+(off?'off':'')+'"><div><b>#'+esc(c.orden)+' ['+esc(c.tienda)+'] '+esc(c.descuento)+'</b> — <code>'+esc(c.codigo||'S/C')+'</code><br><small>'+esc(c.descripcion)+'</small></div><div class="row"><button type="button" class="sm '+(off?'':'on')+'" data-a="tg" data-i="'+esc(c._id)+'">'+(off?'🔴 Apagado':'🟢 Activo')+'</button><button type="button" class="sm" data-a="ed" data-i="'+esc(c._id)+'">✏️ Editar</button><button type="button" class="sm del" data-a="dl" data-i="'+esc(c._id)+'">🗑️</button></div></div>';
  }).join("");
}
$('adminCuponesList').onclick = function(e){
  var b = e.target.closest("button[data-a]"); if(!b) return;
  var id = b.getAttribute("data-i"), a = b.getAttribute("data-a");
  var x = rawC.find(function(i){ return i._id === id; }); if(!x) return;
  if(a === "tg"){ x.activo = (x.activo || "si") === "no" ? "si" : "no"; save("Estado actualizado"); }
  else if(a === "ed"){
    $('c_id').value = id; $('c_tienda').value = x.tienda || ""; $('c_descuento').value = x.descuento || "";
    $('c_descripcion').value = x.descripcion || ""; $('c_codigo').value = x.codigo || ""; $('c_link').value = x.link || "";
    $('c_color').value = x.color || ""; $('c_vence').value = x.vence || ""; $('c_orden').value = x.orden || 10;
    $('c_save_btn').textContent = "💾 Guardar cambios"; $('c_cancel_btn').hidden = false; window.scrollTo(0, 0);
  } else if(a === "dl" && confirm("¿Borrar cupón?")){
    rawC = rawC.filter(function(i){ return i._id !== id; }); save("Cupón borrado");
  }
};
</script>

<script>
var SHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ78FaPhtRhWjNC8uHzkLziSqURlcezoNRJIRfV9yQRLAyCe6U14OGo5qDQl0pm6fCAPyAFX0a3ywY1/pub?single=true&output=csv&gid=";

$('ofertaForm').onsubmit = function(e){
  e.preventDefault();
  var id = $('o_id').value;
  var p = {
    _id: id || uid(), titulo: $('o_titulo').value.trim(), precio: $('o_precio').value.trim(),
    precio_antes: $('o_antes').value.trim(), vendedor: $('o_vendedor').value.trim(),
    imagen: $('o_imagen').value.trim(), link: urlOk($('o_link').value),
    descripcion: $('o_descripcion').value.trim(), instrucciones: $('o_instrucciones').value.trim(), activo: "si"
  };
  if(!p.titulo || !p.precio || !p.link) return msg("⚠️ Faltan datos del producto", true);
  var i = rawO.findIndex(function(x){ return x._id === id; });
  if(i >= 0){ p.activo = rawO[i].activo || "si"; rawO[i] = p; } else rawO.push(p);
  save("Producto guardado").then(function(){
    $('ofertaForm').reset(); $('o_id').value = ""; $('o_save_btn').textContent = "💾 Guardar producto"; $('o_cancel_btn').hidden = true;
  });
};

function drawO(){
  if(!rawO.length){ $('adminOfertasList').innerHTML = "<p style='text-align:center;font-weight:700'>Sin ofertas aún.</p>"; return; }
  $('adminOfertasList').innerHTML = rawO.map(function(o){
    var off = (o.activo || "si") === "no";
    return '<div class="item '+(off?'off':'')+'"><div><b>'+esc(o.titulo)+' — $'+esc(o.precio)+'</b></div><div class="row"><button type="button" class="sm '+(off?'':'on')+'" data-a="tg" data-i="'+esc(o._id)+'">'+(off?'🔴 Apagado':'🟢 Activo')+'</button><button type="button" class="sm" data-a="ed" data-i="'+esc(o._id)+'">✏️ Editar</button><button type="button" class="sm del" data-a="dl" data-i="'+esc(o._id)+'">🗑️</button></div></div>';
  }).join("");
}
$('adminOfertasList').onclick = function(e){
  var b = e.target.closest("button[data-a]"); if(!b) return;
  var id = b.getAttribute("data-i"), a = b.getAttribute("data-a");
  var x = rawO.find(function(i){ return i._id === id; }); if(!x) return;
  if(a === "tg"){ x.activo = (x.activo || "si") === "no" ? "si" : "no"; save("Oferta actualizada"); }
  else if(a === "ed"){
    $('o_id').value = id; $('o_titulo').value = x.titulo || ""; $('o_precio').value = x.precio || "";
    $('o_antes').value = x.precio_antes || ""; $('o_vendedor').value = x.vendedor || "";
    $('o_imagen').value = x.imagen || ""; $('o_link').value = x.link || "";
    $('o_descripcion').value = x.descripcion || ""; $('o_instrucciones').value = x.instrucciones || "";
    $('o_save_btn').textContent = "💾 Guardar cambios"; $('o_cancel_btn').hidden = false;
  } else if(a === "dl" && confirm("¿Borrar producto?")){
    rawO = rawO.filter(function(i){ return i._id !== id; }); save("Producto borrado");
  }
};

function cKey(c){ return urlOk(c.link).toLowerCase() + "|" + String(c.codigo||"").toLowerCase() + "|" + String(c.descuento||"").toLowerCase(); }
function norm(r){
  var o = {};
  Object.keys(r).forEach(function(k){ o[k.trim().toLowerCase().replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u")] = r[k]; });
  return o;
}

$('migrateBtn').onclick = function(){
  msg("⏳ Buscando datos anteriores...", false);
  Promise.all([db.collection("cupones").get(), db.collection("ofertas").get()]).then(function(res){
    var fn = function(x){ var o = Object.assign({ _id: x.id }, x.data()); delete o.likes; delete o.dislikes; return o; };
    rawC = res[0].docs.map(fn); rawO = res[1].docs.map(fn);
    if(!rawC.length && !rawO.length) return msg("⚠️ No había datos anteriores. Usa Importar de Sheet.", true);
    save("Migrados " + rawC.length + " cupones y " + rawO.length + " ofertas");
  }).catch(function(e){ msg("❌ Error: " + e.message, true); });
};

$('importSheetBtn').onclick = function(){
  msg("⏳ Leyendo Google Sheets...", false);
  Promise.all([
    fetch(SHEET + "0&t=" + Date.now()).then(function(r){ return r.text(); }),
    fetch(SHEET + "527305852&t=" + Date.now()).then(function(r){ return r.text(); }).catch(function(){ return ""; })
  ]).then(function(res){
    var c = Papa.parse(res[0], { header: true, skipEmptyLines: true }).data.map(norm);
    var o = res[1] ? Papa.parse(res[1], { header: true, skipEmptyLines: true }).data.map(norm) : [];
    var kc = new Set(rawC.map(cKey)), added = 0;
    c.forEach(function(r){
      if(!urlOk(r.link)) return;
      var it = { _id: uid(), tienda: r.tienda || "Mercado Libre", descuento: r.descuento || "", descripcion: r.descripcion || "", codigo: String(r.codigo||"").trim().toUpperCase(), link: urlOk(r.link), activo: String(r.activo||"si").trim().toLowerCase(), vence: r.vence || "", color: r.color || "", orden: rawC.length + 1, verificado: Date.now() };
      if(!kc.has(cKey(it))){ kc.add(cKey(it)); rawC.push(it); added++; }
    });
    o.forEach(function(r){
      if(!r.titulo || !urlOk(r.link)) return;
      rawO.push({ _id: uid(), titulo: r.titulo, imagen: r.imagen || "", precio: r.precio || "", precio_antes: r.precio_antes || r["precio antes"] || "", descripcion: r.descripcion || "", instrucciones: r.instrucciones || "", vendedor: r.vendedor || "", link: urlOk(r.link), activo: String(r.activo||"si").trim().toLowerCase() });
    });
    save("Importados " + added + " cupones desde Google Sheets");
  }).catch(function(e){ msg("❌ Error al importar: " + e.message, true); });
};

$('dedupeBtn').onclick = function(){
  var s = new Set();
  rawC = rawC.filter(function(x){ var k = cKey(x); if(s.has(k)) return false; s.add(k); return true; });
  save("Repetidos eliminados");
};

msg("🟢 Panel v6 completo (3/3 bloques activos). Listo para usar.", false);
</script>
</body>
</html>
